[package]
name = "smart-auto-downloader"
version = "2.0.0"
description = "Smart Auto Downloader cross-platform desktop application"
authors = ["parikesitad-pm"]
edition = "2021"

[lib]
name = "smart_auto_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
regex = "1.10"
open = "5.1"
dirs = "5.0"
chrono = "0.4"
