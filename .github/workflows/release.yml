name: 'Release Desktop App'

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and Publish Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Smart Auto Downloader ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 Smart Auto Downloader ${{ github.ref_name }}

            Pilih paket installer atau aplikasi sesuai sistem operasi Anda:

            ### 🪟 Windows (x64)
            - **Setup Installer (.exe)**: `Smart Auto Downloader_${{ github.ref_name }}_x64-setup.exe`
            - **Enterprise MSI (.msi)**: `Smart Auto Downloader_${{ github.ref_name }}_x64_en-US.msi`
            - **Portable (ZIP)**: Biner portable mandiri dalam arsip ZIP

            ### 🍏 macOS (Intel & Apple Silicon)
            - **Disk Image Installer (.dmg)**: `Smart Auto Downloader_${{ github.ref_name }}.dmg`
            - **Mac Application (.app)**: Arsip bundel macOS

            ### 🐧 Linux
            - **App Langsung Jalan (.AppImage)**: Cukup download, `chmod +x`, dan jalankan langsung tanpa instalasi!
            - **Debian / Ubuntu Package (.deb)**: `smart-auto-downloader_${{ github.ref_name }}_amd64.deb`

            ---
            ### ✨ Fitur Utama:
            - **YouTube**: 4K Ultra HD, 1080p, 60fps & Shorts dengan auto-muxing FFmpeg.
            - **TikTok**: Download video tanpa watermark otomatis.
            - **Instagram**: Reel & Post video kualitas penuh.
            - **WhatsApp**: Ekstraktor Status HD.
            - **Audio Studio**: MP3 320 kbps, M4A AAC, dan WAV.
            - **Multi-Bahasa**: Pilihan bahasa antarmuka Bahasa Indonesia 🇮🇩 dan English 🇬🇧.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
